# Local PostgreSQL for development.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: patrickjane
      POSTGRES_PASSWORD: patrickjane
      POSTGRES_DB: patrickjane
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patrickjane -d patrickjane"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg-data:
